<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول — إدراء</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
    .login-wrap { width:min(420px,94vw); }
    .login-card { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:40px 36px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .brand { text-align:center; margin-bottom:32px; }
    .brand-icon { font-size:3rem; display:block; margin-bottom:8px; }
    .brand h1 { font-size:1.8rem; font-weight:700; margin:0; }
    .brand p  { color:var(--text-muted); margin:4px 0 0; font-size:.9rem; }
    .field { margin-bottom:18px; }
    .field label { display:block; font-size:.82rem; color:var(--text-muted); margin-bottom:6px; font-weight:500; }
    .field input { width:100%; padding:11px 14px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--font); font-size:.95rem; outline:none; transition:border-color .2s,box-shadow .2s; }
    .field input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,129,247,.15); }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-left:44px; }
    .pw-toggle { position:absolute; left:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1.1rem; padding:0; }
    .pw-toggle:hover { color:var(--accent); }
    .btn-login { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; font-family:var(--font); transition:background .2s,transform .1s; margin-top:8px; }
    .btn-login:hover { background:var(--accent-hover); }
    .btn-login:active { transform:translateY(1px); }
    .btn-login:disabled { opacity:.6; cursor:not-allowed; }
    .error-box { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.4); border-radius:8px; padding:12px 14px; color:var(--danger); font-size:.88rem; margin-bottom:16px; display:none; }
    .error-box.show { display:block; }
    .disabled-box { background:rgba(210,153,34,.08); border:1px solid rgba(210,153,34,.4); border-radius:8px; padding:14px; color:var(--warning); font-size:.88rem; margin-bottom:16px; display:none; line-height:1.7; }
    .disabled-box.show { display:block; }
    .disabled-box a { color:var(--accent); }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">🗂️</span>
      <h1>إدراء</h1>
      <p>نظام أرشفة الطلاب</p>
    </div>

    <div class="error-box"    id="errorBox"></div>
    <div class="disabled-box" id="disabledBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="pw-wrap">
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="togglePw" title="إظهار/إخفاء">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">دخول</button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  // إذا كان مسجل دخول، حوّله مباشرة
  (function() {
    const u = getUser(); const t = getToken();
    if (u && t) redirectByRole(u.role);
  })();

  const form        = document.getElementById('loginForm');
  const errorBox    = document.getElementById('errorBox');
  const disabledBox = document.getElementById('disabledBox');
  const loginBtn    = document.getElementById('loginBtn');

  document.getElementById('togglePw').addEventListener('click', () => {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorBox.className    = 'error-box';
    disabledBox.className = 'disabled-box';
    loginBtn.disabled     = true;
    loginBtn.textContent  = 'جارٍ الدخول...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST', body: { username, password },
      });
      setSession(data.token, data.user);
      redirectByRole(data.user.role);
    } catch (err) {
      if (err.data?.disabled) {
        disabledBox.innerHTML = `
          تم تعطيل الحساب، الرجاء التواصل مع المسؤول.<br>
          📧 <a href="mailto:hussamhamdan52@gmail.com">hussamhamdan52@gmail.com</a>`;
        disabledBox.className = 'disabled-box show';
      } else {
        errorBox.textContent  = err.message || 'بيانات الدخول غير صحيحة.';
        errorBox.className    = 'error-box show';
      }
    } finally {
      loginBtn.disabled    = false;
      loginBtn.textContent = 'دخول';
    }
  });
</script>
</body>
</html>
